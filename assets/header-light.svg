<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Elvis Konjoh Selabi — Smart Contract Verification, Formal Methods, Blockchain Engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0f172a" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#e2e8f0"/>

  <g transform="translate(840 70)" fill="none" stroke-width="2">
    <path d="M70 80 C 120 20, 190 20, 240 80" stroke="#0d9488" stroke-opacity="0.6"/>
    <path d="M240 100 C 190 160, 120 160, 70 100" stroke="#4f46e5" stroke-opacity="0.6"/>
    <path d="M260 110 L 300 150" stroke="#4f46e5" stroke-opacity="0.5"/>
    <path d="M40 90 L 0 90" stroke="#0d9488" stroke-opacity="0.5"/>
    <circle cx="55" cy="90" r="22" stroke="#0d9488" fill="#ffffff"/>
    <circle cx="255" cy="90" r="22" stroke="#4f46e5" fill="#ffffff"/>
    <circle cx="315" cy="165" r="18" stroke="#4f46e5" fill="#ffffff"/>
    <circle cx="315" cy="165" r="12" stroke="#4f46e5" fill="none"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#334155" stroke="none" text-anchor="middle">
      <text x="55" y="95">q0</text>
      <text x="255" y="95">q1</text>
      <text x="315" y="170">q2</text>
      <text x="155" y="22" fill="#0f766e">deposit(v) [v &gt; 0]</text>
      <text x="155" y="165" fill="#4338ca">withdraw(v) [v ≤ bal]</text>
    </g>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="104" font-size="46" font-weight="700" fill="#0f172a">Elvis Konjoh Selabi</text>
    <rect x="64" y="124" width="88" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="166" font-size="22" fill="#334155">Smart Contract Verification · Formal Methods</text>
    <text x="64" y="198" font-size="22" fill="#334155">Full-Stack &amp; Blockchain Engineering · PhD</text>
    <text x="64" y="244" font-size="16" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">spec → verify → generate → test  ·  L'Aquila, Italy</text>
